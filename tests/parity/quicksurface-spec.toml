# What QUICKSURFACE Pro says it does, from its public pages only, in our own words.
#
# Nobody ran, installed or took output from QUICKSURFACE to write this (ground rules:
# behaviour comes from public documentation). Each entry names the page it was read on.
# `measurable_claim` is the vendor's own statement, not a measurement of ours.
# `acceptance` is how SolidCraft will be tested against truth, never against QUICKSURFACE output.
#
# Sources (all read 2026-11-18):
#   PRO  = https://www.quicksurface.com/quicksurface-pro/
#   HOME = https://www.quicksurface.com/
#   N27  = https://www.quicksurface.com/whats-new-quicksurface-2027/
#   N26  = https://www.quicksurface.com/whats-new-qs2026
#   AI   = https://www.quicksurface.com/quicksurface-ai/
#   CS   = https://www.central-scanning.co.uk/product/quicksurface/   (reseller)
#
# Not read (HTTP 429 or 404 on 2026-11-18): the tutorial index (?p=QS7_quickstart), Novedge,
# Revopoint, CDG, the product comparison page. Rows the prompt expected that no page read
# supports are listed at the end under [unsourced] and are not counted.

version = "QUICKSURFACE 2027"
read_on = "2026-11-18"

# ---------------------------------------------------------------- import
[[capability]]
id = "QS-001"
area = "import"
capability = "Reads meshes from any scanner as STL, OBJ or PLY"
source = "https://www.quicksurface.com/quicksurface-pro/"
measurable_claim = "three formats named"
acceptance = "one generated part written as binary STL, ASCII STL, OBJ and PLY; file.insert_mesh gives the same body (points, triangles, volume) from each"

[[capability]]
id = "QS-002"
area = "import"
capability = "Reads PTX point clouds from long-range scanners"
source = "https://www.quicksurface.com/quicksurface-pro/"
measurable_claim = "none stated"
acceptance = "a generated PTX grid of a plane and a cylinder imports as a point cloud; scan.mesh_from_points meshes it within 2 sigma of the truth surface"

[[capability]]
id = "QS-003"
area = "import"
capability = "Loads a mesh of any size"
source = "https://www.quicksurface.com/"
measurable_claim = "handles about 100 million triangles (HOME, Q&A 4); 'any size' (PRO); minimum machine 16 GB RAM"
acceptance = "generated meshes of 10M, 50M and 100M triangles: insert, survey, fit a plane, save; time and peak memory recorded against scan-bench.toml budgets"

