# Parity matrix: each capability of tests/parity/quicksurface-spec.toml against SolidCraft.
#
# status:
#   proven               a named test of the capability exists and passed in the run below
#   implemented-untested a command exists; no test named here was run and passed
#   partial              works in part; `finding` or `note` says what is missing
#   missing              no command does it
#   n/a                  not a capability SolidCraft should have, or put out of scope by the owner;
#                        `note` says why, and the report lists each under what may not be claimed
#
# "proven" here means capability only: the command does the job on a clean generated part.
# Accuracy under noise and against truth is Phase 3 (tests/scan-bench.toml), not this file.
#
# docs/parity/matrix.md is made from this file; edit this one.

[run]
sha = "a73b2306c"
date = "2026-11-18"
tree = "clean worktree, branch scan-parity"
commands = [
  "sctest -p solidcraft-scan",
  "sctest -p solidcraft-engine scan",
  "sctest -p solidcraft-ui-egui scan",
]
# results are filled in from the run; see docs/parity/matrix.md
results_table = [
  ["sctest -p solidcraft-scan", "319 run, 319 passed"],
  ["sctest -p solidcraft-engine scan", "187 run, 187 passed"],
  ["sctest -p solidcraft-ui-egui scan", "131 run, 131 passed"],
]
# The first run, at 8138b307c, had 9 failures (8 engine, 1 UI): fixed in 8a6fcc5b0, d4c787cdb,
# e61add2b9 and 3bae9824d on this branch.

